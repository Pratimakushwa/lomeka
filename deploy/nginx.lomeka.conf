# Copy to /etc/nginx/sites-available/lomeka and symlink into sites-enabled.
# Replace your-domain.com and SSL paths after certbot.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # After Certbot, this block usually redirects to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/lomeka/frontend/dist;
    index index.html;

    client_max_body_size 25m;

    # Frontend SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API + admin auth cookies (same origin → secure cookies work)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
