# First-time HTTP config. After DNS works, run:
#   certbot --nginx -d lomeka.opserv.in
# Certbot will add SSL automatically.
# Replace server_name if your domain is different.

server {
    listen 80;
    listen [::]:80;
    server_name lomeka.opserv.in;

    root /var/www/projects/lomeka/frontend/dist;
    index index.html;

    client_max_body_size 25m;

    # Frontend SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API (PORT 9090 — 5000 already used on this server)
    location /api/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
